name: Update Node Dependencies
on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@latest
          cache: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend application
        run: pnpm run build
