name: check

on:
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm run check

      - name: Unused code & deps (knip)
        run: pnpm run knip

      - name: Unit tests (vitest)
        run: pnpm run test

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Format check (prettier)
        run: pnpm run fmt:check

      - name: Build frontend
        run: pnpm run build

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Configure Rust dependency caching
        uses: Swatinem/rust-cache@v2

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Format check (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check
